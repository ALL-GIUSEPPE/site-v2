<script>
    
    const masterUrls = [
         "https://ilovebadmusic.net", "https://pirko.nl", "https://dagerblad.club",
         "https://rein.computer", "https://silkevanwijngaarden.nl", "https://robinbird.net",
        "https://myponylittle.com", "https://jesseandriesse.info", "https://guaveguaveguave.com",
        "https://hugoremmen.nl", "https://alienheadshitkid.neocities.org", "https://ardemar.art",
        "https://finnbekkering.com", "https://zelfbailed.com", "http://berendbartje.nl",
        "https://www.estendorp.nl", "https://clairensed.jimdosite.com", "https://worldwildwest.neocities.org",
        "https://www.timmiebimmie.nl", "https://www.Roxyspikkel.com", "https://www.graffitek.nl", 
        "https://www.johannvangerwen.com","https://merelvankesteren.netlify.app"
    ];

    
    let currentShown = [...masterUrls];
    
    const chars = "¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ABCDEFGHIKLMNOPQRSTVXYZ0123456789#%&?@$";
    const container = document.getElementById('friendsContainer');
    const body = document.getElementById('bodyTag');
    let linkElements = [];

   
    function init() {
        currentShown.forEach((url, i) => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            
            const a = document.createElement('a');
            a.href = url;
            a.className = 'friend-link';
            a.target = "_blank";
            a.innerText = url;
            
            div.appendChild(a);
            container.appendChild(div);
            linkElements.push(a);
        });
    }

    
    function scrambleEffect(element, finalTarget) { //hacker verander teken dingen
        let iteration = 0;
        const interval = setInterval(() => {
            element.innerText = finalTarget.split("")
                .map((letter, index) => {
                    if(index < iteration) return finalTarget[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                })
                .join("");

            if(iteration >= finalTarget.length) {
                clearInterval(interval);
                element.href = finalTarget; 
            }
            iteration += 1 / 2; 
        }, 25);
    }

   
    let trackIndex = 0;

    function rotateOneByOne() {
        body.classList.add('flicker');
        setTimeout(() => body.classList.remove('flicker'), 60);

       
        const first = currentShown.shift();
        currentShown.push(first);

       
        scrambleEffect(linkElements[trackIndex], currentShown[trackIndex]);

        trackIndex = (trackIndex + 1) % linkElements.length;
    }

    function toggleMenu() {
        const menu = document.getElementById('menuOverlay');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    init();
    setInterval(rotateOneByOne, 2000);
</script>
